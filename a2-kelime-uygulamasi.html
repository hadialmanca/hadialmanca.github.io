<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goethe A2 Kelime Çalışması</title>
<style>
  :root {
    --purple: #4A148C;
    --purple-light: #7B1FA2;
    --pink: #C2185B;
    --bg: #FAF5FC;
    --card-bg: #FFFFFF;
    --green: #2E7D32;
    --red: #C62828;
    --gray: #666;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, var(--bg), #F3E5F5);
    color: #222;
    min-height: 100vh;
    padding: 12px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 {
    text-align: center;
    color: var(--purple);
    font-size: 22px;
    margin: 8px 0 4px;
  }
  .subtitle { text-align:center; color: var(--gray); font-size: 13px; margin-bottom: 14px; }
  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 14px;
  }
  select, button.modebtn {
    padding: 9px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--purple-light);
    background: white;
    color: var(--purple);
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  button.modebtn.active { background: var(--purple); color: white; }
  .stats {
    display:flex; justify-content: center; gap: 18px;
    font-size: 13px; color: var(--gray); margin-bottom: 10px;
  }
  .stats b { color: var(--purple); }
  .progressbar {
    height: 8px; background: #E1BEE7; border-radius: 6px; overflow:hidden; margin-bottom: 18px;
  }
  .progressbar > div { height: 100%; background: linear-gradient(90deg, var(--pink), var(--purple)); transition: width .3s; }

  /* Flashcard */
  .card {
    background: var(--card-bg);
    border-radius: 18px;
    box-shadow: 0 6px 24px rgba(74,20,140,0.15);
    min-height: 260px;
    padding: 28px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    position: relative;
    border: 2px solid #EDE0F5;
  }
  .cat-tag {
    position: absolute; top: 12px; left: 16px;
    font-size: 11px; color: var(--purple-light); font-weight: 700;
    background: #F3E5F5; padding: 3px 10px; border-radius: 20px;
  }
  .de-word { font-size: 26px; font-weight: 700; color: var(--purple); margin-bottom: 8px; }
  .hint { font-size: 12px; color: #AAA; margin-top: 10px; }
  .back-content { display:none; }
  .card.flipped .front-content { display:none; }
  .card.flipped .back-content { display:block; }
  .tr-meaning { font-size: 22px; font-weight: 700; color: var(--pink); margin-bottom: 14px; }
  .sentence-de { font-style: italic; font-size: 16px; margin-bottom: 6px; color: #333; }
  .sentence-tr { font-size: 14px; color: var(--gray); }

  .answerbtns { display:flex; gap: 12px; margin-top: 18px; }
  .answerbtns button {
    flex: 1; padding: 14px 8px; border-radius: 12px; border: none;
    font-size: 15px; font-weight: 700; cursor: pointer; color: white;
  }
  .btn-zor { background: var(--red); }
  .btn-biliyorum { background: var(--green); }
  .answerbtns.hidden { display: none; }

  /* Quiz */
  .quiz-question { font-size: 15px; color: var(--gray); text-align:center; margin-bottom: 6px; }
  .quiz-word { font-size: 26px; font-weight: 700; color: var(--purple); text-align:center; margin-bottom: 4px; }
  .quiz-sentence { font-style: italic; text-align:center; color:#555; font-size:14px; margin-bottom: 18px; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt {
    padding: 14px 10px; border-radius: 12px; border: 2px solid #E1BEE7;
    background: white; font-size: 14px; cursor: pointer; text-align:center;
  }
  .opt.correct { background: #C8E6C9; border-color: var(--green); }
  .opt.wrong { background: #FFCDD2; border-color: var(--red); }
  .opt.disabled { pointer-events: none; }

  .empty-state { text-align:center; padding: 40px 20px; color: var(--gray); }
  .empty-state button { margin-top:14px; }
  .resetlink { text-align:center; margin-top: 18px; }
  .resetlink a { color: #AAA; font-size: 12px; cursor:pointer; text-decoration: underline; }
  @media (max-width:480px){
    .de-word{font-size:22px;} .tr-meaning{font-size:18px;} .quiz-word{font-size:22px;}
    .options{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div style="text-align:center; margin-bottom:10px;">
    <a href="a2.html" style="color:#7B1FA2; font-size:13px; font-weight:700; text-decoration:none;">⬅ A2 Konu Listesine Dön</a>
  </div>

  <div id="nameGate" style="display:flex; min-height:70vh; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:20px;">
    <div style="font-size:44px; margin-bottom:10px;">🧺</div>
    <div style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:26px; color:var(--purple); margin-bottom:6px;">Merhaba!</div>
    <div style="font-size:15px; color:#666; margin-bottom:22px;">Devam edebilmek için adını yaz</div>
    <input id="nameInput" placeholder="Adın Soyadın" style="font-family:'Karla',sans-serif; font-size:16px; padding:12px 18px; border-radius:10px; border:1.5px solid #E1BEE7; width:260px; max-width:80vw; text-align:center; margin-bottom:14px;">
    <button onclick="submitName()" style="font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px; background:var(--pink); color:#fff; padding:12px 32px; border:none; border-radius:10px; cursor:pointer;">Başla →</button>
  </div>

  <div id="appRoot" style="display:none;">
  <h1>🇩🇪 Goethe A2 Kelime Çalışması</h1>
  <div class="subtitle">Hadi Almanca — Sınav Hazırlık Aracı</div>

  <div class="controls">
    <select id="catSelect"></select>
    <button class="modebtn active" id="btnFlash" onclick="setMode('flash')">🃏 Kelime Kartı</button>
    <button class="modebtn" id="btnQuiz" onclick="setMode('quiz')">📝 Quiz</button>
    <button class="modebtn" style="background:#eee; color:#333;" onclick="changeStudent()" id="studentBadge">👤 —</button>
  </div>

  <div class="stats">
    <div>Toplam: <b id="statTotal">0</b></div>
    <div>Öğrenilen: <b id="statLearned">0</b></div>
    <div>Bugün tekrar: <b id="statDue">0</b></div>
  </div>
  <div class="progressbar"><div id="progFill" style="width:0%"></div></div>

  <div id="stage"></div>

  <div class="resetlink"><a onclick="resetProgress()">İlerlemeyi sıfırla</a></div>
  </div>
</div>

<script>
const DATA = [{"title":"Aile ve Kişisel Bilgiler","words":[{"de":"der Bruder, ¨-","tr":"erkek kardeş","sde":"Mein Bruder wohnt in Berlin.","str":"Erkek kardeşim Berlin'de oturuyor."},{"de":"der Cousin, -s","tr":"erkek kuzen","sde":"Mein Cousin kommt aus der Türkei.","str":"Erkek kuzenim Türkiye'den geliyor."},{"de":"die Cousine, -n","tr":"kız kuzen","sde":"Meine Cousine ist Studentin.","str":"Kız kuzenim üniversite öğrencisi."},{"de":"die Eltern (Pl.)","tr":"ebeveyn","sde":"Meine Eltern wohnen nicht in Deutschland.","str":"Ebeveynlerim Almanya'da oturmuyor."},{"de":"der Enkel, -","tr":"erkek torun","sde":"Ihr Enkel ist erst drei Jahre alt.","str":"Onun erkek torunu daha üç yaşında."},{"de":"die Enkelin, -nen","tr":"kız torun","sde":"Meine Enkelin besucht mich am Wochenende.","str":"Kız torunum hafta sonu beni ziyaret ediyor."},{"de":"die Geschwister (Pl.)","tr":"kardeşler","sde":"Hast du Geschwister?","str":"Kardeşlerin var mı?"},{"de":"die Großeltern (Pl.)","tr":"büyükanne ve büyükbaba","sde":"Am Sonntag besuchen wir unsere Großeltern.","str":"Pazar günü büyükanne ve büyükbabamızı ziyaret ediyoruz."},{"de":"die Großmutter, ¨- / Oma","tr":"büyükanne","sde":"Meine Oma kocht sehr gut.","str":"Büyükannem çok iyi yemek pişirir."},{"de":"der Großvater, ¨- / Opa","tr":"büyükbaba","sde":"Mein Opa liest jeden Tag Zeitung.","str":"Büyükbabam her gün gazete okur."},{"de":"das Kind, -er","tr":"çocuk","sde":"Das Kind spielt im Garten.","str":"Çocuk bahçede oynuyor."},{"de":"die Mutter, ¨- / Mama","tr":"anne","sde":"Meine Mutter arbeitet als Lehrerin.","str":"Annem öğretmen olarak çalışıyor."},{"de":"der Onkel, -","tr":"amca, dayı, enişte","sde":"Mein Onkel wohnt in Hamburg.","str":"Amcam Hamburg'da oturuyor."},{"de":"die Schwester, -n","tr":"kız kardeş","sde":"Meine Schwester studiert Medizin.","str":"Kız kardeşim tıp okuyor."},{"de":"der Sohn, ¨-e","tr":"oğul","sde":"Unser Sohn geht schon zur Schule.","str":"Oğlumuz zaten okula gidiyor."},{"de":"die Tante, -n","tr":"teyze, hala, yenge","sde":"Meine Tante kommt aus Izmir.","str":"Teyzem İzmir'den geliyor."},{"de":"die Tochter, ¨-","tr":"kız evlat","sde":"Meine Tochter ist sehr fleißig.","str":"Kızım çok çalışkan."},{"de":"der Vater, ¨- / Papa","tr":"baba","sde":"Mein Vater fährt jeden Tag mit dem Bus.","str":"Babam her gün otobüsle gidiyor."},{"de":"der/die Verwandte, -n","tr":"akraba","sde":"Wir haben viele Verwandte in der Türkei.","str":"Türkiye'de birçok akrabamız var."},{"de":"ledig","tr":"bekar","sde":"Ich bin ledig.","str":"Ben bekarım."},{"de":"verheiratet","tr":"evli","sde":"Sie ist seit fünf Jahren verheiratet.","str":"O beş yıldır evli."},{"de":"getrennt / geschieden","tr":"ayrılmış / boşanmış","sde":"Meine Eltern sind geschieden.","str":"Ebeveynlerim boşanmış."},{"de":"heißen, heißt, hat geheißen","tr":"isim taşımak","sde":"Ich heiße Ahmet.","str":"Benim adım Ahmet."},{"de":"der Ehepartner","tr":"eş","sde":"Das ist ein süßes Ehepaar.","str":"Bu çok tatlı bir çift."},{"de":"schwanger sein","tr":"hamile olmak","sde":"Lena ist schwanger.","str":"Lena hamile."},{"de":"weiblich","tr":"dişi, kadın","sde":"Wählen Sie bitte: weiblich oder männlich.","str":"Lütfen 'kadın' ya da 'erkek' seçin."},{"de":"der Gast, ¨-e","tr":"misafir, konuk","sde":"Heute Abend haben wir Gäste.","str":"Bu akşam misafirimiz var."},{"de":"der Nachbar, -n / die Nachbarin, -nen","tr":"komşu","sde":"Mein Nachbar kommt aus Brasilien.","str":"Komşum Brezilya'dan geliyor."},{"de":"sterben, stirbt, ist gestorben","tr":"ölmek","sde":"Sein Vater ist gestern gestorben.","str":"Onun babası dün öldü."},{"de":"tot","tr":"ölü","sde":"Meine Großeltern sind schon lange tot.","str":"Büyükannem ve büyükbabam öleli çok oldu."},{"de":"das Taschengeld","tr":"harçlık","sde":"Wie viel Taschengeld bekommst du?","str":"Ne kadar harçlık alıyorsun?"}]},{"title":"Meslekler ve Çalışma Hayatı","words":[{"de":"der/die Angestellte, -n","tr":"personel, memur","sde":"Er ist Angestellter bei einer Bank.","str":"O bir bankada memur."},{"de":"der Arzt, ¨-e / die Ärztin, -nen","tr":"doktor","sde":"Meine Schwester ist Ärztin.","str":"Kız kardeşim doktor."},{"de":"der/die Auszubildende, -n","tr":"stajyer","sde":"Er ist Auszubildender bei Siemens.","str":"O Siemens'te stajyer."},{"de":"der Autor, -en / die Autorin, -nen","tr":"yazar","sde":"Sie ist eine bekannte Autorin.","str":"O tanınmış bir yazar."},{"de":"der Babysitter, -","tr":"bebek bakıcısı","sde":"Der Babysitter passt heute Abend auf die Kinder auf.","str":"Bebek bakıcısı bu akşam çocuklara bakıyor."},{"de":"der Bäcker, - / die Bäckerin, -nen","tr":"fırıncı","sde":"Der Bäcker macht sehr gutes Brot.","str":"Fırıncı çok iyi ekmek yapıyor."},{"de":"der Fahrer, - / die Fahrerin, -nen","tr":"şoför","sde":"Der Fahrer wartet vor dem Haus.","str":"Şoför evin önünde bekliyor."},{"de":"der Friseur, -e / die Friseurin, -nen","tr":"kuaför","sde":"Ich habe morgen einen Termin beim Friseur.","str":"Yarın kuaförde randevum var."},{"de":"der Handwerker, - / die Handwerkerin, -nen","tr":"usta","sde":"Der Handwerker repariert die Heizung.","str":"Usta kaloriferi tamir ediyor."},{"de":"der Hausmann, ¨-er / die Hausfrau, -en","tr":"ev erkeği / ev hanımı","sde":"Er ist jetzt Hausmann und sie arbeitet.","str":"O şimdi ev erkeği ve o (kadın) çalışıyor."},{"de":"der Journalist, -en / die Journalistin, -nen","tr":"gazeteci","sde":"Er arbeitet als Journalist.","str":"O gazeteci olarak çalışıyor."},{"de":"der Kaufmann, Kaufleute / die Kauffrau, -en","tr":"tüccar","sde":"Sein Vater ist Kaufmann.","str":"Onun babası tüccar."},{"de":"der Kellner, - / die Kellnerin, -nen","tr":"garson","sde":"Der Kellner bringt uns die Speisekarte.","str":"Garson bize menüyü getiriyor."},{"de":"der Koch, ¨-e / die Köchin, -nen","tr":"aşçı","sde":"Der Koch kocht sehr lecker.","str":"Aşçı çok lezzetli yemek pişiriyor."},{"de":"der Krankenpfleger, - / die Krankenschwester, -n","tr":"hasta bakıcı / hemşire","sde":"Die Krankenschwester hilft dem Patienten.","str":"Hemşire hastaya yardım ediyor."},{"de":"der Künstler, - / die Künstlerin, -nen","tr":"sanatçı","sde":"Er ist ein bekannter Künstler.","str":"O tanınmış bir sanatçı."},{"de":"der Lehrer, - / die Lehrerin, -nen","tr":"öğretmen","sde":"Meine Lehrerin ist sehr nett.","str":"Öğretmenim çok kibar."},{"de":"der Mechaniker, - / die Mechanikerin, -nen","tr":"tamirci","sde":"Der Mechaniker repariert mein Auto.","str":"Tamirci arabamı tamir ediyor."},{"de":"das Model, -s","tr":"model","sde":"Sie möchte Model werden.","str":"O model olmak istiyor."},{"de":"der Musiker, - / die Musikerin, -nen","tr":"müzisyen","sde":"Er ist Musiker und spielt Gitarre.","str":"O müzisyen ve gitar çalıyor."},{"de":"der Polizist, -en / die Polizistin, -nen","tr":"polis","sde":"Rufen Sie die Polizei!","str":"Polisi çağırın!"},{"de":"der Rentner, - / die Rentnerin, -nen","tr":"emekli","sde":"Mein Onkel arbeitet nicht mehr, er ist Rentner.","str":"Amcam artık çalışmıyor, o emekli."},{"de":"der Sänger, - / die Sängerin, -nen","tr":"şarkıcı","sde":"Diese Sängerin ist ein Star in Deutschland.","str":"Bu şarkıcı Almanya'da bir yıldız."},{"de":"der Schauspieler, - / die Schauspielerin, -nen","tr":"aktör / aktris","sde":"Er ist ein berühmter Schauspieler.","str":"O ünlü bir aktör."},{"de":"der Techniker, - / die Technikerin, -nen","tr":"tekniker","sde":"Der Techniker repariert den Fernseher.","str":"Tekniker televizyonu tamir ediyor."},{"de":"der Verkäufer, - / die Verkäuferin, -nen","tr":"satıcı, tezgahtar","sde":"Die Verkäuferin hilft mir gern.","str":"Satıcı bana memnuniyetle yardım ediyor."},{"de":"der Beruf, -e","tr":"meslek","sde":"Was bist du von Beruf?","str":"Mesleğin nedir?"},{"de":"die Ausbildung, -en","tr":"mesleki eğitim","sde":"Ich möchte eine Ausbildung zum Krankenpfleger machen.","str":"Hasta bakıcı olmak için mesleki eğitim almak istiyorum."},{"de":"die Erfahrung, -en","tr":"deneyim, tecrübe","sde":"Ich habe zehn Jahre Erfahrung in diesem Beruf.","str":"Bu meslekte on yıllık deneyimim var."},{"de":"herstellen, stellt her, hat he ":"başarmak, üstesinden gelmek","sde":"Ich schaffe das nicht alleine.","str":"Bunu tek başıma başaramam."},{"de":"schlimm","tr":"kötü","sde":"Kein Problem, das ist nicht so schlimm.","str":"Sorun değil, bu o kadar kötü değil."},{"de":"schmutzig","tr":"kirli","sde":"Das Handtuch ist schmutzig.","str":"Havlu kirli."},{"de":"schneiden, schneidet, hat geschnitten","tr":"kesmek","sde":"Wer schneidet dir die Haare?","str":"Saçlarını kim kesiyor?"},{"de":"schwer","tr":"ağır, zor","sde":"Wie schwer ist das Paket?","str":"Bu paket ne kadar ağır?"},{"de":"schwierig","tr":"zor","sde":"Die Prüfung war nicht schwierig.","str":"Sınav zor değildi."},{"de":"sicher","tr":"güvenli, emin, kesin","sde":"Ich bin ganz sicher, dass er kommt.","str":"Geleceğinden tamamen eminim."},{"de":"tief","tr":"derin","sde":"Vorsicht, das Wasser ist tief!","str":"Dikkat, su derin!"},{"de":"toll","tr":"harika","sde":"Der Urlaub war toll.","str":"Tatil harikaydı."},{"de":"typisch","tr":"tipik","sde":"Diese Musik ist typisch für dieses Land.","str":"Bu müzik bu ülke için tipik."},{"de":"verlieren, verliert, hat verloren","tr":"kaybetmek","sde":"Ich habe meinen Schlüssel verloren.","str":"Anahtarımı kaybettim."},{"de":"verstehen, versteht, hat verstanden","tr":"anlamak","sde":"Können Sie mich verstehen?","str":"Beni anlayabiliyor musunuz?"},{"de":"versuchen, versucht, hat versucht","tr":"denemek","sde":"Kann ich es auch einmal versuchen?","str":"Ben de bir deneyebilir miyim?"},{"de":"vergessen, vergisst, hat vergessen","tr":"unutmak","sde":"Ich habe meine Hausaufgaben vergessen.","str":"Ödevlerimi unuttum."},{"de":"sich vorbereiten, hat vorbereitet","tr":"hazırlanmak","sde":"Ich muss mich auf meine Prüfung vorbereiten.","str":"Sınavıma hazırlanmam gerekiyor."},{"de":"voll","tr":"dolu","sde":"Morgens und abends sind die Züge immer sehr voll.","str":"Sabah ve akşamları trenler hep çok dolu olur."},{"de":"wechseln, wechselt, hat gewechselt","tr":"değiştirmek","sde":"Wir müssen den Reifen wechseln.","str":"Lastiği değiştirmemiz gerekiyor."},{"de":"wecken, weckt, hat geweckt","tr":"uyandırmak","sde":"Bitte wecken Sie mich morgen früh um fünf.","str":"Lütfen beni yarın sabah beşte uyandırın."},{"de":"weich","tr":"yumuşak","sde":"Ich möchte zum Frühstück ein weiches Ei.","str":"Kahvaltıda yumuşak bir yumurta istiyorum."},{"de":"werden, wird, ist geworden","tr":"olmak","sde":"Mein Sohn will Arzt werden.","str":"Oğlum doktor olmak istiyor."},{"de":"wissen, weiß, hat gewusst","tr":"bilmek","sde":"Woher wissen Sie das?","str":"Bunu nereden biliyorsunuz?"},{"de":"witzig","tr":"komik","sde":"Warum lachst du? Ich finde das nicht witzig.","str":"Neden gülüyorsun? Bunu komik bulmuyorum."},{"de":"zeigen, zeigt, hat gezeigt","tr":"göstermek","sde":"Können Sie mir bitte den Weg zum Bahnhof zeigen?","str":"Tren istasyonuna giden yolu gösterebilir misiniz lütfen?"},{"de":"zuhören, hört zu, hat zugehört","tr":"dinlemek","sde":"Hör mir doch mal zu!","str":"Beni bir dinle!"},{"de":"zumachen, macht zu, hat zugemacht","tr":"kapatmak","sde":"Machst du bitte das Fenster zu?","str":"Pencereyi kapatır mısın lütfen?"}]}];
let mode = 'flash';
let currentCat = 'all';
let progress = {};
let queue = [];
let qIdx = 0;
let currentWord = null;

function wordKey(w){ return w.de; }

function allWords(){
  let list = [];
  DATA.forEach(cat=>{
    if(currentCat==='all' || currentCat===cat.title){
      cat.words.forEach(w=>list.push(Object.assign({cat:cat.title}, w)));
    }
  });
  return list;
}

function now(){ return Date.now(); }
const DAY = 24*60*60*1000;
const INTERVALS = [0, DAY, 3*DAY, 7*DAY, 14*DAY];

function getProg(key){
  return progress[key] || {level:0, due:0, seen:false};
}

function markAnswer(key, correct){
  let p = getProg(key);
  if(correct){
    p.level = Math.min(p.level+1, 4);
  } else {
    p.level = 0;
  }
  p.due = now() + INTERVALS[p.level];
  p.seen = true;
  progress[key] = p;
  saveProgress();
  updateStats();
}

let studentName = null;

function saveProgress(){
  try {
    localStorage.setItem('kelime_sepeti__' + studentName + '__a2_progress', JSON.stringify(progress));
  } catch(e){ console.error('storage error', e); }
}

function loadProgress(){
  try {
    const raw = localStorage.getItem('kelime_sepeti__' + studentName + '__a2_progress');
    if(raw) progress = JSON.parse(raw);
  } catch(e){ progress = {}; }
}

function submitName(){
  const val = document.getElementById('nameInput').value.trim();
  if(!val) return;
  studentName = val;
  localStorage.setItem('kelime_sepeti_student_name', val);
  document.getElementById('nameGate').style.display = 'none';
  document.getElementById('appRoot').style.display = '';
  bootApp();
}
function changeStudent(){
  if(!confirm('Öğrenci değiştirilsin mi? "'+studentName+'" adındaki ilerleme kayıtlı kaldı, aynı isimle tekrar girince kaldığı yerden devam eder.')) return;
  localStorage.removeItem('kelime_sepeti_student_name');
  location.reload();
}
document.getElementById('nameInput')?.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submitName(); });


function buildQueue(){
  const words = allWords();
  const due = words.filter(w=>{
    const p = getProg(wordKey(w));
    return p.due <= now();
  });
  // shuffle
  for(let i=due.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [due[i],due[j]]=[due[j],due[i]];
  }
  queue = due.slice(0, 25);
  qIdx = 0;
}

function updateStats(){
  const words = allWords();
  document.getElementById('statTotal').innerText = words.length;
  const learned = words.filter(w=>getProg(wordKey(w)).level>=4).length;
  document.getElementById('statLearned').innerText = learned;
  const due = words.filter(w=>getProg(wordKey(w)).due<=now()).length;
  document.getElementById('statDue').innerText = due;
  document.getElementById('progFill').style.width = words.length? Math.round(learned/words.length*100)+'%':'0%';
}

function populateCatSelect(){
  const sel = document.getElementById('catSelect');
  sel.innerHTML = '<option value="all">Tüm Kategoriler</option>' +
    DATA.map(c=>`<option value="${c.title}">${c.title}</option>`).join('');
  sel.onchange = ()=>{ currentCat = sel.value; buildQueue(); render(); updateStats(); };
}

function setMode(m){
  mode = m;
  document.getElementById('btnFlash').classList.toggle('active', m==='flash');
  document.getElementById('btnQuiz').classList.toggle('active', m==='quiz');
  buildQueue();
  render();
}

function nextCard(){
  qIdx++;
  if(qIdx >= queue.length){ buildQueue(); }
  render();
}

function render(){
  const stage = document.getElementById('stage');
  updateStats();
  if(queue.length===0){
    stage.innerHTML = `<div class="empty-state">🎉 Bu kategori için şu an tekrar edilecek kelime yok!<br>Harika gidiyorsun. Yarın tekrar kontrol et ya da başka bir kategori seç.<br>
    <button class="modebtn" onclick="forceReview()">Yine de çalışmak istiyorum</button></div>`;
    return;
  }
  currentWord = queue[qIdx];
  if(mode==='flash'){ renderFlash(stage); } else { renderQuiz(stage); }
}

function forceReview(){
  const words = allWords();
  for(let i=words.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [words[i],words[j]]=[words[j],words[i]];
  }
  queue = words.slice(0,25);
  qIdx = 0;
  render();
}

function renderFlash(stage){
  const w = currentWord;
  stage.innerHTML = `
    <div class="card" id="flashcard" onclick="flipCard()">
      <div class="cat-tag">${w.cat}</div>
      <div class="front-content">
        <div class="de-word">${w.de}</div>
        <div class="hint">Anlamını görmek için karta dokun</div>
      </div>
      <div class="back-content">
        <div class="tr-meaning">${w.tr}</div>
        <div class="sentence-de">${w.sde}</div>
        <div class="sentence-tr">${w.str}</div>
      </div>
    </div>
    <div class="answerbtns hidden" id="answerbtns">
      <button class="btn-zor" onclick="answerFlash(false)">😵 Zorlandım</button>
      <button class="btn-biliyorum" onclick="answerFlash(true)">✅ Biliyorum</button>
    </div>
  `;
}

function flipCard(){
  document.getElementById('flashcard').classList.add('flipped');
  document.getElementById('answerbtns').classList.remove('hidden');
}

function answerFlash(correct){
  markAnswer(wordKey(currentWord), correct);
  nextCard();
}

function renderQuiz(stage){
  const w = currentWord;
  const pool = allWords().filter(x=>x.de!==w.de);
  const distractors = [];
  const sameCat = pool.filter(x=>x.cat===w.cat);
  const source = sameCat.length>=3 ? sameCat : pool;
  const shuffled = source.slice().sort(()=>Math.random()-0.5);
  for(const c of shuffled){
    if(distractors.length>=3) break;
    if(!distractors.includes(c.tr) && c.tr!==w.tr) distractors.push(c.tr);
  }
  const options = [w.tr, ...distractors].sort(()=>Math.random()-0.5);
  stage.innerHTML = `
    <div class="quiz-question">Bu kelimenin Türkçe anlamı nedir?</div>
    <div class="quiz-word">${w.de}</div>
    <div class="quiz-sentence">${w.sde}</div>
    <div class="options" id="opts">
      ${options.map(o=>`<div class="opt" onclick="answerQuiz(this,'${o.replace(/'/g,"\\'")}')">${o}</div>`).join('')}
    </div>
  `;
}

function answerQuiz(el, chosen){
  const correct = currentWord.tr;
  const opts = document.querySelectorAll('.opt');
  opts.forEach(o=>{
    o.classList.add('disabled');
    if(o.innerText===correct) o.classList.add('correct');
  });
  if(chosen!==correct) el.classList.add('wrong');
  markAnswer(wordKey(currentWord), chosen===correct);
  setTimeout(nextCard, 900);
}

function resetProgress(){
  if(confirm('Tüm ilerleme sıfırlansın mı?')){
    progress = {};
    saveProgress();
    buildQueue();
    render();
  }
}

function applyHashCategory(){
  const hash = location.hash.replace(/^#/, '');
  if(!hash) return;
  const params = new URLSearchParams(hash);
  const cat = params.get('cat');
  if(cat){
    const decoded = decodeURIComponent(cat);
    const exists = DATA.some(c => c.title === decoded);
    if(exists){
      currentCat = decoded;
      const sel = document.getElementById('catSelect');
      if(sel) sel.value = decoded;
    }
  }
}

async function bootApp(){
  document.getElementById('studentBadge').textContent = '👤 ' + studentName;
  populateCatSelect();
  applyHashCategory();
  loadProgress();
  buildQueue();
  render();
}

function init(){
  const saved = localStorage.getItem('kelime_sepeti_student_name');
  if(saved){
    studentName = saved;
    document.getElementById('nameGate').style.display = 'none';
    document.getElementById('appRoot').style.display = '';
    bootApp();
  } else {
    document.getElementById('nameGate').style.display = 'flex';
    document.getElementById('appRoot').style.display = 'none';
  }
}
init();
</script>
