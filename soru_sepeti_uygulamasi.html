  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("script.google.com") === -1) return null;
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",

}

    return '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">' + inner + '</g></svg>';

    '<g fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">' + inner + '</g>' +

    '<line x1="35" y1="35" x2="165" y2="165" stroke="#D0021B" stroke-width="10"/></svg>';
}

// ---------- Teil 2 blank-template + reply logic ----------
const W_PHRASES = ["Um wie viel Uhr","Von wann bis wann","In welcher","Was für eine","Was für ein","Was für",
  "Wie viele","Wie lange","Seit wann","Wie viel","Wie groß","Wie hoch","Wie spät","Wie oft",
  "Mit wem","Welches","Woher","Wohin","Wann","Warum","Wie","Wer","Was","Wo"];
const NOUN_GAP = new Set(["Wie viele","Was für ein","Was für eine","Was für","In welcher","Welches"]);
function blankTemplate(de) {
  const hasQ = de.endsWith("?");
  const core = hasQ ? de.slice(0,-1) : de;
  const tokens = core.split(" ");
  let matched = null;
  for (const p of W_PHRASES) {
    const pt = p.split(" ");
    if (tokens.slice(0, pt.length).join(" ") === p) { matched = p; break; }
  }
  let out;
  if (matched) {
    const pLen = matched.split(" ").length;
    const rest = tokens.slice(pLen);
    if (NOUN_GAP.has(matched)) { out = ["________", rest[0], "________", ...rest.slice(2)]; }
    else { out = ["________", "________", ...rest.slice(1)]; }
  } else { out = ["________", ...tokens.slice(1)]; }
  return out.join(" ") + (hasQ ? "?" : "");
}
const VERB_MAP = {kommst:"komme",hast:"habe",wohnst:"wohne",trinkst:"trinke",arbeitest:"arbeite",
  sprichst:"spreche",isst:"esse",lernst:"lerne",machst:"mache",kochst:"koche",siehst:"sehe",
  fährst:"fahre",spielst:"spiele",tanzt:"tanze",malst:"male",liest:"lese",benutzt:"benutze",
  feierst:"feiere",kaufst:"kaufe",magst:"mag",bist:"bin",hörst:"höre",gehst:"gehe",bekommst:"bekomme",
  gibst:"gebe",trägst:"trage",nimmst:"nehme",triffst:"treffe",telefonierst:"telefoniere"};
function autoReply(de) {
  const hasQ = de.endsWith("?");
  const core = hasQ ? de.slice(0,-1) : de;
  const tokens = core.split(" ");
  const verb = tokens[0], rest = tokens.slice(1);
  if (rest[0] !== "du") return null;
  const ich = VERB_MAP[verb.toLowerCase()];
  if (!ich) return null;
  const map = {dein:"mein",deine:"meine",deinen:"meinen",deinem:"meinem",deiner:"meiner"};
  const after = rest.slice(1).map(w => map[w] || w);
  return "Ja, ich " + ich + (after.length ? " " + after.join(" ") : "") + ".";
}
function getReply(de) { return autoReply(de) || T2_REPLY[de] || "..."; }

const urlParams = new URLSearchParams(window.location.search);
let part = urlParams.get("part") === "teil3" ? "teil3" : "teil2";
let studentName = localStorage.getItem("soru_sepeti_name") || "";
let mode = "home"; // home | practice-theme | practice-card | quiz-setup | quiz
let curThemeIdx = 0, curWordIdx = 0, curIdeaIdx = 0;
let revealStep = 0;
let completedWords = new Set();
let quizPool = [], quizIdx = 0, quizScore = 0, quizTotal = 0, quizAnswered = false, quizChoice = null;

const app = document.getElementById("app");

function curThemes() { return part === "teil2" ? T2_THEMES : T3_THEMES.concat([{ title: "14. Yasaklı Kartlar", verbote:true, words: T3_VERBOTE }]); }

function flatIdeasT2(themeIdx) {
  const arr = [];
  T2_THEMES[themeIdx].words.forEach((w, wi) => w.ideas.forEach((idea, ii) => arr.push({wi, ii, w, idea})));
  return arr;
}

function render() {
  if (mode === "home") renderHome();
  else if (mode === "practice-theme") renderPracticeTheme();
  else if (mode === "practice-card") renderPracticeCard();
  else if (mode === "quiz-setup") renderQuizSetup();
  else if (mode === "quiz") renderQuiz();
}

function renderPartTabs() {
  return `<div class="part-tabs">
    <button class="part-btn ${part==='teil2'?'active':''}" onclick="switchPart('teil2')">📘 Sprechen Teil 2</button>
    <button class="part-btn ${part==='teil3'?'active':''}" onclick="switchPart('teil3')">🙏 Sprechen Teil 3</button>
  </div>`;
}
window.switchPart = function(p) { part = p; window.__tab = "practice"; mode = "home"; render(); };

function renderTabs(active) {
  return renderPartTabs() + `<div class="tabs">
    <button class="tab-btn ${active==='practice'?'active':''}" onclick="goHome('practice')">📇 Kart Modu</button>
    <button class="tab-btn ${active==='quiz'?'active':''}" onclick="goHome('quiz')">📝 Quiz Modu</button>
  </div>`;
}

function renderHome() {
  const themes = curThemes();
  app.innerHTML = renderTabs(window.__tab || "practice") + `
    <div style="text-align:right; font-size:12px; color:var(--gray); margin-bottom:10px;">👤 ${studentName} · <a href="#" onclick="changeName();return false;" style="color:var(--navy);">adını değiştir</a></div>
    <div class="theme-grid">
    ${themes.map((t, i) => `<button class="theme-btn" style="background:${THEME_COLORS[i % THEME_COLORS.length]}" onclick="openTheme(${i})">${t.title}<span class="n">${t.words.length} kart</span></button>`).join("")}
    </div>`;
}

window.openTheme = function(i) {
  curThemeIdx = i;
  const themes = curThemes();
  if (window.__tab === "quiz") {
    if (part === "teil2") {
      quizPool = flatIdeasT2(i).map(x => ({tr:x.idea[0], de:x.idea[1], word:x.w.w}));
    } else {
      const th = themes[i];
      if (th.verbote) {
        quizPool = th.words.map(v => ({tr:v.tr, de:"Uyarı: " + v.de, word:v.de, verboten:true, uyari:v.de}));
      } else {
        quizPool = th.words.map(w => ({tr:w.tr, de:w.bitte[0], word:w.de}));
      }
    }
    mode = "quiz-setup"; render(); return;
  }
  curWordIdx = 0; curIdeaIdx = 0; revealStep = 0;
  mode = "practice-theme"; render();
};

function renderPracticeTheme() {
  const theme = curThemes()[curThemeIdx];
  app.innerHTML = `
    ${renderPartTabs()}
    <div class="backbar"><button onclick="goHome('practice')">← Temalar</button></div>
    <h2 style="margin:0 0 12px;color:var(--navy)">${theme.title}</h2>
    <div class="word-chip-row">
      ${theme.words.map((w, wi) => `<span class="word-chip ${completedWords.has(part+'-'+curThemeIdx+'-'+wi)?'done':''}" onclick="startCard(${wi})">${part==='teil2'?w.w:w.de}</span>`).join("")}
    </div>
    <div style="text-align:center;margin-top:20px;">
      <button style="background:var(--teal);color:#fff;border:none;padding:14px 26px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;" onclick="startCard(0)">▶ Baştan Başla</button>
    </div>`;
}

window.startCard = function(wi) {
  curWordIdx = wi; curIdeaIdx = 0; revealStep = 0;
  mode = "practice-card"; render();
};

function cardVisualHtml(inner) {
  return `<div class="card-visual">
    <div class="card-tabs"><div class="card-tab-left">Start Deutsch 1</div><div class="card-tab-right">Sprechen Teil ${part==='teil2'?'2':'3'}</div></div>
    ${inner}
  </div>`;
}

function renderPracticeCard() {
  const theme = curThemes()[curThemeIdx];
  const word = theme.words[curWordIdx];
  const isLastWord = curWordIdx === theme.words.length - 1;

  if (part === "teil2") {
    const idea = word.ideas[curIdeaIdx];
    const isLastIdea = curIdeaIdx === word.ideas.length - 1;
    const flipped = revealStep === 2;
    app.innerHTML = `
      ${renderPartTabs()}
      <div class="backbar"><button onclick="mode='practice-theme';render()">← ${theme.title}</button></div>
      ${cardVisualHtml(`<div class="card-thema">Thema: ${theme.title.replace(/^\\d+\\.\\s*/,'')}</div><div class="card-word">${word.w}</div>`)}
      <div class="idea-box"><div class="flip-outer"><div class="flip-inner ${flipped?'flipped':''}">
        <div class="flip-face flip-front">
          <div class="idea-progress">Fikir ${curIdeaIdx+1} / ${word.ideas.length}</div>
          <p class="idea-tr">${idea[0]}</p>
          ${revealStep >= 1
            ? `<p class="f-line">F: ${blankTemplate(idea[1])}</p><button class="reveal-btn answer" onclick="revealStep=2;render()">Cevabı Göster</button>`
            : `<button class="reveal-btn" onclick="revealStep=1;render()">Soruyu Göster</button>`}
        </div>
        <div class="flip-face flip-back">
          <div class="back-label">Doğru cevap</div>
          <p class="filled-line">✓ ${idea[1]}</p>
          <p class="a-line">A: ${getReply(idea[1])}</p>
        </div>
      </div></div></div>
      <div class="navrow">
        <button onclick="prevIdea()" ${(curIdeaIdx===0 && curWordIdx===0)?'disabled':''}>◀ Önceki</button>
        <span class="counter">${word.ideas.length} fikirden ${curIdeaIdx+1}.</span>
        <button onclick="nextIdea()">${(isLastIdea && isLastWord) ? 'Bitir ✓' : 'Sonraki ▶'}</button>
      </div>`;
    return;
  }

  // TEIL 3
  const isVerbote = theme.verbote;
  const flipped = revealStep === 2;
  const iconSvg = iconSvgString(word.icon, isVerbote);
  let frontExtra, backExtra;
  if (isVerbote) {
    frontExtra = revealStep >= 1
      ? `<p class="f-line">Uyarı: Hier dürfen Sie nicht ...! Das ist verboten!</p><p class="f-line">İzin: Darf ich hier ...?</p><button class="reveal-btn answer" onclick="revealStep=2;render()">Cevabı Göster</button>`
      : `<button class="reveal-btn" onclick="revealStep=1;render()">Rica/Uyarıyı Göster</button>`;
    backExtra = `<div class="back-label">Doğru cevap</div>
      <p class="filled-line">✓ ${word.de}</p>
      <p class="a-line">A (uyarı): In Ordnung. Entschuldigung.</p>
      <p class="a-line">A (izin): Nein, hier dürfen Sie das nicht.</p>`;
  } else {
    frontExtra = revealStep >= 1
      ? `${word.bitte.map((b,i)=>`<p class="f-line">${i+1}. ${b}</p>`).join("")}<button class="reveal-btn answer" onclick="revealStep=2;render()">Cevabı Göster</button>`
      : `<button class="reveal-btn" onclick="revealStep=1;render()">Rica Cümlelerini Göster</button>`;
    backExtra = `<div class="back-label">Örnek cevap</div>
      <p class="filled-line">✓ ${word.antwort}</p>
      <p class="a-line">(${word.jest})</p>`;
  }
  app.innerHTML = `
    ${renderPartTabs()}
    <div class="backbar"><button onclick="mode='practice-theme';render()">← ${theme.title}</button></div>
    ${cardVisualHtml(`<div class="card-icon-wrap">${iconSvg}</div>`)}
    <p style="text-align:center;font-weight:700;margin:6px 0 16px;">${word.de} <span style="color:var(--gray);font-weight:400;">(${word.tr})</span></p>
    <div class="idea-box"><div class="flip-outer"><div class="flip-inner ${flipped?'flipped':''}">
      <div class="flip-face flip-front">${frontExtra}</div>
      <div class="flip-face flip-back">${backExtra}</div>
    </div></div></div>
    <div class="navrow">
      <button onclick="prevIdea()" ${curWordIdx===0?'disabled':''}>◀ Önceki</button>
      <span class="counter">${theme.words.length} karttan ${curWordIdx+1}.</span>
      <button onclick="nextIdea()">${isLastWord ? 'Bitir ✓' : 'Sonraki ▶'}</button>
    </div>`;
}

window.nextIdea = function() {
  const theme = curThemes()[curThemeIdx];
  const word = theme.words[curWordIdx];
  if (part === "teil2" && curIdeaIdx < word.ideas.length - 1) { curIdeaIdx++; revealStep=0; render(); return; }
  completedWords.add(part+'-'+curThemeIdx+'-'+curWordIdx);
  if (curWordIdx < theme.words.length - 1) { curWordIdx++; curIdeaIdx=0; revealStep=0; render(); }
  else { submitCardPass(curThemeIdx); mode = "practice-theme"; render(); }
};
window.prevIdea = function() {
  if (part === "teil2" && curIdeaIdx > 0) { curIdeaIdx--; revealStep=2; render(); return; }
  if (curWordIdx > 0) { curWordIdx--; curIdeaIdx = part==='teil2' ? curThemes()[curThemeIdx].words[curWordIdx].ideas.length - 1 : 0; revealStep=2; render(); }
};

function renderQuizSetup() {
  const theme = curThemes()[curThemeIdx];
  app.innerHTML = renderTabs("quiz") + `
    <div class="backbar"><button onclick="goHome('quiz')">← Temalar</button></div>
    <div class="empty-select">
      <h2 style="color:var(--navy)">${theme.title}</h2>
      <p>${quizPool.length} soru havuzundan quiz başlıyor.</p>
      <button style="background:var(--coral);color:#fff;border:none;padding:14px 26px;border-radius:10px;font-weight:700;font-size:16px;cursor:pointer;" onclick="startQuiz()">▶ Quiz'e Başla</button>
    </div>`;
}

window.startQuiz = function() {
  quizIdx = 0; quizScore = 0; quizTotal = 0; quizAnswered = false; quizChoice = null; scoreSubmitted = false; quizWrong = [];
  shuffle(quizPool);
  mode = "quiz"; render();
};
function shuffle(a) { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }

function renderNameScreen() {
  app.innerHTML = `
    <div style="text-align:center; padding: 40px 10px;">
      <div style="font-size:40px; margin-bottom:10px;">👋</div>
      <h2 style="color:var(--navy); margin-bottom:6px;">Hoş geldin!</h2>
      <p style="color:var(--gray); margin-bottom:20px;">Devam etmeden önce adını yazar mısın? Sonuçların bu isimle kaydedilecek.</p>
      <input id="nameInput" type="text" placeholder="Adın Soyadın" style="padding:12px 16px; border-radius:8px; border:2px solid var(--card-border); font-size:15px; width:100%; max-width:280px; margin-bottom:14px;" />
      <br/>
      <button style="background:var(--teal); color:#fff; border:none; padding:12px 28px; border-radius:8px; font-weight:700; font-size:15px; cursor:pointer;" onclick="submitName()">Başla →</button>
    </div>`;
  document.getElementById("nameInput").addEventListener("keydown", function(e){ if (e.key === "Enter") submitName(); });
  document.getElementById("nameInput").focus();
}
window.submitName = function() {
  const v = document.getElementById("nameInput").value.trim();
  if (!v) { document.getElementById("nameInput").style.borderColor = "var(--coral)"; return; }
  studentName = v;
  localStorage.setItem("soru_sepeti_name", studentName);
  mode = "home"; render();
};
window.changeName = function() {
  studentName = "";
  localStorage.removeItem("soru_sepeti_name");
  renderNameScreen();
};

let scoreSubmitted = false;
let quizWrong = []; // yanlış yapılan sorular (bu quiz oturumu için)
function computeGrade(pct) {
  if (pct >= 90) return "Pekiyi 🏆";
  if (pct >= 75) return "İyi 👍";
  if (pct >= 60) return "Orta 🙂";
  if (pct >= 45) return "Geçer 📘";
  return "Tekrar Çalış 💪";
}
function submitScore(themeIdx) {
  if (scoreSubmitted) return;
  scoreSubmitted = true;
  const pct = quizTotal > 0 ? Math.round((quizScore / quizTotal) * 100) : 0;
  apiCall("completeQuiz", {
    name: studentName,
    thema: CONFIG_THEMA[part],
    quizSet: themeIdx + 1,
    direction: "tr-de",
    score: quizScore, total: quizTotal, pct: pct,
    grade: computeGrade(pct),
    wrongWords: quizWrong.join(", ")
  });
}
function submitCardPass(themeIdx) {
  apiCall("completeCardPass", { name: studentName, thema: CONFIG_THEMA[part] + "-Kart" + (themeIdx + 1) });
}

function renderQuiz() {
  if (quizIdx >= quizPool.length) {
    submitScore(curThemeIdx);
    app.innerHTML = renderTabs("quiz") + `
      <div class="quiz-card" style="text-align:center;">
        <h2 style="color:var(--navy)">Quiz Bitti! 🎉</h2>
        <p style="font-size:18px;">Skor: <b>${quizScore} / ${quizTotal}</b></p>
        <button class="quiz-next" onclick="mode='home';render()">Temalara Dön</button>
      </div>`;
    return;
  }
  const q = quizPool[quizIdx];
  if (!q.__opts) {
    const distractorPool = quizPool.filter(x => x !== q).map(x => x.de);
    shuffle(distractorPool);
    const opts = [q.de, ...distractorPool.slice(0,3)];
    shuffle(opts);
    q.__opts = opts;
  }
  app.innerHTML = renderTabs("quiz") + `
    <div class="scorebar"><span>Soru ${quizIdx+1} / ${quizPool.length}</span><span>Skor: ${quizScore}</span></div>
    <div class="quiz-card">
      <div class="quiz-card-context">🗂️ Kart: <b>${q.word}</b></div>
      <p class="quiz-q">${q.tr}</p>
      ${q.__opts.map((opt) => `<button class="quiz-opt ${quizAnswered ? (opt===q.de?'correct':(opt===quizChoice?'wrong':'')) : ''}" ${quizAnswered?'disabled':''} onclick="answerQuiz('${encodeURIComponent(opt)}')">${opt}</button>`).join("")}
      ${quizAnswered ? `<button class="quiz-next" onclick="nextQuiz()">Sonraki Soru ▶</button>` : ""}
    </div>`;
}
window.answerQuiz = function(encOpt) {
  if (quizAnswered) return;
  const opt = decodeURIComponent(encOpt);
  quizChoice = opt; quizAnswered = true; quizTotal++;
  if (opt === quizPool[quizIdx].de) quizScore++;
  else quizWrong.push(quizPool[quizIdx].word || quizPool[quizIdx].tr);
  render();
};
window.nextQuiz = function() {
  quizIdx++; quizAnswered = false; quizChoice = null;
  render();
};

window.goHome = function(tab) { window.__tab = tab; mode = "home"; render(); };

if (studentName) { render(); } else { renderNameScreen(); }
</script>
</body>
</html>
