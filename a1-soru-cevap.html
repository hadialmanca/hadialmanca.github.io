<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goethe A1 Kelime Soru-Cevap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:#1E3B2F;
    --green-mid:#2F5D45;
    --paper:#FBF3E1;
    --mustard:#E3A93A;
    --tomato:#C1442C;
    --muted:#9FB8A6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Karla',sans-serif;
    background:var(--green-deep);
    color:var(--paper);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 20px;
    background:rgba(0,0,0,0.18);
    flex-wrap:wrap; gap:10px;
    z-index:5;
  }
  .title{
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:19px; color:var(--mustard);
  }
  .controls{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  select, button{
    font-family:'Karla',sans-serif; font-weight:700; font-size:13px;
    border-radius:8px; border:none; padding:8px 12px; cursor:pointer;
  }
  select{ background:var(--paper); color:var(--green-deep); max-width:260px; }
  button.modebtn{ background:var(--mustard); color:var(--green-deep); }
  button.modebtn.alt{ background:var(--tomato); color:var(--paper); }
  button.smallbtn{ background:rgba(255,255,255,0.15); color:var(--paper); }
  .progress{ font-size:13px; color:var(--muted); white-space:nowrap; }

  #stage{
    flex:1; overflow:hidden; position:relative;
    display:flex; flex-direction:column;
    cursor:pointer;
  }
  #log{
    flex:1; overflow-y:auto; padding:26px 6vw 90px;
    scroll-behavior:smooth;
  }
  .row{
    display:flex; align-items:baseline; gap:18px;
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,0.08);
    opacity:0.55;
    transition:opacity .25s ease;
  }
  .row.active{ opacity:1; }
  .row .num{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px;
    color:var(--muted); min-width:42px; text-align:right; flex-shrink:0;
  }
  .row .q{
    font-family:'Baloo 2',sans-serif; font-weight:800;
    font-size:clamp(20px, 3.4vw, 34px);
    color:var(--paper);
    flex:1;
  }
  .row .a{
    font-family:'Baloo 2',sans-serif; font-weight:700;
    font-size:clamp(18px, 2.8vw, 28px);
    color:var(--mustard);
    opacity:0; transform:translateX(-6px);
    transition:opacity .3s ease, transform .3s ease;
    flex:1;
  }
  .row .a.show{ opacity:1; transform:translateX(0); }
  .cat-divider{
    font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:1px;
    padding:18px 0 6px; border-bottom:2px solid rgba(255,255,255,0.15); margin-top:6px;
  }
  .hint{
    text-align:center; padding:12px 14px 16px; font-size:13px; color:var(--muted);
    flex-shrink:0;
  }
  .done-state{
    display:flex; align-items:center; justify-content:center; height:100%;
    flex-direction:column; text-align:center;
  }
  .done-state .big{
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:44px; color:var(--mustard); margin-bottom:12px;
  }

  .tally{
    display:flex; gap:14px; font-size:14px; font-weight:700; align-items:center;
  }
  .tally .ok{ color:#8BD4A0; }
  .tally .bad{ color:#F09A8C; }

  .markbtns{
    display:flex; gap:22px; justify-content:center; padding:22px 6vw 26px;
    flex-wrap:wrap;
  }
  .markbtn{
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:clamp(18px,2.6vw,26px);
    padding:16px 40px; border-radius:16px; border:none; cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,0.25);
  }
  .markbtn:active{ transform:translateY(4px); box-shadow:none; }
  .markbtn.ok{ background:#3FA85C; color:#fff; }
  .markbtn.bad{ background:var(--tomato); color:#fff; }

  .results{
    max-width:720px; margin:0 auto; text-align:center; padding:20px;
  }
  .results .scoreline{
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:clamp(30px,5vw,52px);
    margin-bottom:6px;
  }
  .results .scoreline .ok{ color:#8BD4A0; }
  .results .scoreline .bad{ color:#F09A8C; }
  .results .pct{
    font-size:22px; color:var(--mustard); font-weight:700; margin-bottom:18px;
  }
  .results .verdict{
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:24px;
    padding:14px 20px; border-radius:14px; margin-bottom:22px; display:inline-block;
  }
  .verdict.hazir{ background:rgba(63,168,92,0.25); color:#8BD4A0; }
  .verdict.orta{ background:rgba(227,169,58,0.25); color:var(--mustard); }
  .verdict.dusuk{ background:rgba(193,68,44,0.25); color:#F09A8C; }
  .missed-title{ font-size:15px; color:var(--muted); margin-bottom:10px; text-align:left; }
  .missed-list{
    text-align:left; max-height:240px; overflow-y:auto;
    background:rgba(0,0,0,0.15); border-radius:12px; padding:14px 18px;
    margin-bottom:22px; font-size:16px; line-height:1.9;
  }
  .missed-list b{ color:var(--mustard); }
  .results-actions{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .results-actions button{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px;
    background:var(--mustard); color:var(--green-deep); padding:12px 22px; border-radius:10px;
  }
  .results-actions button.secondary{ background:rgba(255,255,255,0.15); color:var(--paper); }

  @media (max-width:600px){
    .title{font-size:15px;}
    select, button{font-size:11px; padding:7px 9px;}
    select{max-width:150px;}
    .row .num{min-width:30px; font-size:12px;}
  }
</style>
</head>
<body>

<div style="text-align:center; padding:8px 0 0; background:rgba(0,0,0,0.18);"><a href="a1.html" style="color:#CFE3D4; font-size:13px; font-weight:700; text-decoration:none;">⬅ A1 Konu Listesine Dön</a></div>

<div id="nameGate" style="display:flex; min-height:90vh; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:20px;">
  <div style="font-size:44px; margin-bottom:10px;">🧺</div>
  <div style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:26px; color:var(--mustard); margin-bottom:6px;">Merhaba!</div>
  <div style="font-size:15px; color:var(--muted); margin-bottom:22px;">Devam edebilmek için adını yaz</div>
  <input id="nameInput" placeholder="Adın Soyadın" style="font-family:'Karla',sans-serif; font-size:16px; padding:12px 18px; border-radius:10px; border:none; width:260px; max-width:80vw; text-align:center; margin-bottom:14px;">
  <button onclick="submitName()" style="font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px; background:var(--mustard); color:var(--green-deep); padding:12px 32px; border:none; border-radius:10px; cursor:pointer;">Başla →</button>
</div>

<div id="appRoot" style="display:none;">
<header>
  <div class="title">🇩🇪 Goethe A1 Kelime Soru-Cevap</div>
  <div class="controls">
    <select id="catSelect"></select>
    <button class="modebtn" id="modeBtn" onclick="toggleMode()">Almanca ➜ Türkçe</button>
    <button class="smallbtn" onclick="prevStep()">◀ Geri</button>
    <button class="smallbtn" onclick="resetAll()">Baştan Başlat</button>
    <button class="smallbtn" onclick="changeStudent()" id="studentBadge">👤 —</button>
  </div>
  <div class="tally" id="tally">✅ <span id="tallyOk" class="ok">0</span> &nbsp; ❌ <span id="tallyBad" class="bad">0</span></div>
  <div class="progress" id="progress">0 / 0</div>
</header>

<div id="stage">
  <div id="log" onclick="stageClick()"></div>
  <div id="markArea"></div>
  <div class="hint" id="hintText">Ekrana veya boşluk tuşuna basarak ilerleyin · Geri almak için ← tuşu</div>
</div>
</div>

mek"},{"de":"zeigen","tr":"göstermek"},{"de":"die Zeit, -en","tr":"zaman"},{"de":"zum Beispiel","tr":"örneğin"},{"de":"zu sein","tr":"kapalı olmak"},{"de":"die Bibliothek, -en","tr":"kütüphane"}]}];

let flat = [];
DATA.forEach((cat, ci)=>{
  cat.words.forEach(w=> flat.push({de:w.de, tr:w.tr, cat:cat.title, catIndex:ci}));
});

let mode = 'de-tr';        // 'de-tr' or 'tr-de'
let currentCatIndex = 0;   // which theme is active
let sessionList = [];      // the ordered list of words for the CURRENT round
let roundNumber = 1;       // which round of this theme we're on
let themeTotal = 0;        // how many words the theme started with (round 1 size)
let missCounts = {};       // wordKey -> how many times marked wrong across all rounds of this theme
let roundMissed = null;    // set once the current round finishes: words missed this round (null while round in progress)
let pos = 0;                // position within sessionList currently being built
let started = false;        // question for sessionList[pos] shown yet?
let phase = 0;               // 0 = question only, 1 = question+answer
let markOrder = [];          // [{correct:boolean}] in order, one per completed word (index == its pos)
let history = [];            // undo stack: {pos, started, phase, isMark}

function wordKey(w){ return w.de + '||' + w.tr; }
function catWords(ci){ return ci===DATA.length ? flat.slice() : flat.filter(w=>w.catIndex===ci); }

let studentName = null;

function stateKey(){ return 'kelime_sepeti__' + studentName + '__a1_presenter_state_v4'; }

function loadState(){
  try{
    const raw = localStorage.getItem(stateKey());
    if(raw){
      const s = JSON.parse(raw);
      if(s.mode) mode = s.mode;
      if(typeof s.currentCatIndex === 'number') currentCatIndex = s.currentCatIndex;
      if(typeof s.pos === 'number') pos = s.pos;
      if(typeof s.started === 'boolean') started = s.started;
      if(typeof s.phase === 'number') phase = s.phase;
      if(Array.isArray(s.markOrder)) markOrder = s.markOrder;
      if(typeof s.roundNumber === 'number') roundNumber = s.roundNumber;
      if(typeof s.themeTotal === 'number') themeTotal = s.themeTotal;
      if(s.missCounts) missCounts = s.missCounts;
      if(Array.isArray(s.sessionList) && s.sessionList.length) sessionList = s.sessionList;
      if(s.roundMissed !== undefined) roundMissed = s.roundMissed;
    }
  }catch(e){ /* first run for this student */ }
  if(!sessionList.length){ sessionList = catWords(currentCatIndex); themeTotal = sessionList.length; }
}
function saveState(){
  try{
    localStorage.setItem(stateKey(), JSON.stringify({
      mode, currentCatIndex, pos, started, phase, markOrder,
      roundNumber, themeTotal, missCounts, sessionList, roundMissed
    }));
  }catch(e){}
}

function submitName(){
  const val = document.getElementById('nameInput').value.trim();
  if(!val) return;
  studentName = val;
  localStorage.setItem('kelime_sepeti_student_name', val);
  document.getElementById('nameGate').style.display = 'none';
  document.getElementById('appRoot').style.display = '';
  bootApp();
}
function changeStudent(){
  if(!confirm('Öğrenci değiştirilsin mi? "'+studentName+'" adındaki ilerleme kayıtlı kaldı, aynı isimle tekrar girince kaldığı yerden devam eder.')) return;
  localStorage.removeItem('kelime_sepeti_student_name');
  location.reload();
}

document.getElementById('nameInput')?.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submitName(); });


function startTheme(ci){
  currentCatIndex = ci;
  sessionList = catWords(ci);
  themeTotal = sessionList.length;
  roundNumber = 1; missCounts = {}; roundMissed = null;
  pos = 0; started = false; phase = 0; markOrder = []; history = [];
  saveState();
  render();
}

function populateCatSelect(){
  const sel = document.getElementById('catSelect');
  sel.innerHTML = DATA.map((c,i)=>`<option value="${i}">${c.title} (${c.words.length} kelime)</option>`).join('');
  sel.innerHTML += `<option value="${DATA.length}">📚 Tüm Temalar — Toplam ${flat.length} kelime</option>`;
  sel.value = currentCatIndex;
  sel.onchange = ()=> startTheme(parseInt(sel.value,10));
}

function toggleMode(){
  mode = mode==='de-tr' ? 'tr-de' : 'de-tr';
  updateModeBtn();
  saveState();
  render();
}
function updateModeBtn(){
  const btn = document.getElementById('modeBtn');
  btn.textContent = mode==='de-tr' ? 'Almanca ➜ Türkçe' : 'Türkçe ➜ Almanca';
  btn.classList.toggle('alt', mode==='tr-de');
}

function resetAll(){
  if(!confirm('Bu temayı baştan başlatmak istediğine emin misin? Tüm turlar ve skor sıfırlanacak.')) return;
  startTheme(currentCatIndex);
}

function snapshot(isMark){ return {pos, started, phase, isMark}; }

function stageClick(){
  if(roundMissed !== null) return; // round finished, waiting for "next round" action
  if(pos >= sessionList.length) return;
  if(phase === 1) return; // must mark, not just click through
  history.push(snapshot(false));
  if(!started){ started = true; phase = 0; }
  else { phase = 1; }
  saveState();
  render();
}

function mark(correct){
  if(roundMissed !== null) return;
  if(pos >= sessionList.length || phase !== 1) return;
  history.push(snapshot(true));
  markOrder.push({correct});
  pos++; started = false; phase = 0;
  if(pos === sessionList.length){ finishRound(); }
  saveState();
  render();
}

function finishRound(){
  const missed = [];
  markOrder.forEach((m,i)=>{ if(!m.correct) missed.push(sessionList[i]); });
  missed.forEach(w=>{ const k = wordKey(w); missCounts[k] = (missCounts[k]||0) + 1; });
  roundMissed = missed;
}

function nextRound(){
  if(!roundMissed || roundMissed.length === 0) return;
  sessionList = roundMissed;
  roundNumber++;
  roundMissed = null;
  pos = 0; started = false; phase = 0; markOrder = []; history = [];
  saveState();
  render();
}

function prevStep(){
  if(roundMissed !== null) return; // no step-back once a round has finished; use "Bu Temayı Yeniden Başlat" instead
  const h = history.pop();
  if(!h) return;
  if(h.isMark) markOrder.pop();
  pos = h.pos; started = h.started; phase = h.phase;
  saveState();
  render();
}

document.addEventListener('keydown', (e)=>{
  if(roundMissed !== null) return;
  if(e.code === 'Space'){ e.preventDefault(); stageClick(); }
  if(e.code === 'ArrowLeft'){ e.preventDefault(); prevStep(); }
  if(phase === 1 && pos < sessionList.length){
    if(e.key === 'y' || e.key === 'Y' || e.code === 'ArrowRight'){ e.preventDefault(); mark(true); }
    if(e.key === 'n' || e.key === 'N' || e.code === 'ArrowDown'){ e.preventDefault(); mark(false); }
  }
});

function firstRoundMessage(pct){
  if(pct >= 90) return '🌟 Harika bir başlangıç! Bu kelimeleri gerçekten çok iyi biliyorsun.';
  if(pct >= 70) return '👍 Güzel gidiyorsun! Birkaç kelimeyi bir kez daha görelim, hemen oturacak.';
  if(pct >= 40) return '💪 Fena değil! Şimdi sadece bilemediklerin üzerinde duracağız, birazdan çok daha rahat olacaksın.';
  return '🌱 Bu kelimeler senin için yeni, hiç sorun değil! Birkaç tur tekrar ettikçe hepsi kalıcı olacak.';
}
function laterRoundMessage(testedCount, correctCount, remaining){
  let msg = `👏 Az önce ${testedCount} kelimeyi tekrar sorduk, ${correctCount} tanesini bu kez doğru bildin!`;
  if(remaining <= 3) msg += ` Sadece ${remaining} kelime kaldı, neredeyse tamamsın! 🚀`;
  else if(remaining < testedCount) msg += ` Yanlış sayın azalıyor, böyle devam! 💪`;
  return msg;
}
function masteryVerdict(rounds){
  if(rounds <= 1) return '🎉 Muhteşem! İlk turda tüm kelimeleri bildin — bu temaya tamamen hazırsın.';
  if(rounds <= 3) return `🎉 Harika iş çıkardın! ${rounds} turda tüm kelimeleri öğrendin. Birkaç gün sonra bir kez daha gözden geçirmen bunu iyice kalıcı hale getirir.`;
  return `🎉 Sonunda hepsini öğrendin, tebrikler! Bu tema biraz zaman aldı — önümüzdeki günlerde 1-2 kez daha tekrar edersen tamamen kalıcı olacak.`;
}

function renderRoundResults(){
  const log = document.getElementById('log');
  document.getElementById('markArea').innerHTML = '';
  document.getElementById('hintText').style.display = 'none';
  const correct = markOrder.filter(m=>m.correct).length;
  const wrong = roundMissed.length;
  const pct = markOrder.length ? Math.round((correct/markOrder.length)*100) : 0;

  if(wrong === 0){
    // fully mastered: show final summary across all rounds
    const toughEntries = Object.entries(missCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const toughHtml = toughEntries.length
      ? toughEntries.map(([k,c])=>{ const [de,tr] = k.split('||'); return `<div><b>${de}</b> — ${tr} <span style="color:var(--muted)">(${c} kez yanlış)</span></div>`; }).join('')
      : '';
    log.innerHTML = `
      <div class="results">
        <div class="scoreline"><span class="ok">✅ ${themeTotal} / ${themeTotal}</span></div>
        <div class="pct">${roundNumber}. turda tamamlandı</div>
        <div class="verdict ${roundNumber<=1?'hazir':'orta'}">${masteryVerdict(roundNumber)}</div>
        ${toughHtml ? `<div class="missed-title">Biraz daha zaman alan kelimeler (artık bunları da biliyorsun 👏):</div><div class="missed-list">${toughHtml}</div>` : ''}
        <div class="results-actions">
          <button class="secondary" onclick="resetAll()">Bu Temayı Yeniden Başlat</button>
        </div>
      </div>`;
    return;
  }

  const encourage = roundNumber === 1 ? firstRoundMessage(pct) : laterRoundMessage(sessionList.length, correct, wrong);
  const missedHtml = roundMissed.map(w=>`<div><b>${mode==='de-tr'?w.de:w.tr}</b> — ${mode==='de-tr'?w.tr:w.de}</div>`).join('');
  log.innerHTML = `
    <div class="results">
      <div class="scoreline"><span class="ok">✅ ${correct}</span> &nbsp;/&nbsp; <span class="bad">❌ ${wrong}</span></div>
      <div class="pct">${roundNumber}. tur · %${pct} başarı</div>
      <div class="verdict orta">${encourage}</div>
      <div class="missed-title">Şimdi sadece şu kelimelere bakacağız:</div>
      <div class="missed-list">${missedHtml}</div>
      <div class="results-actions">
        <button onclick="nextRound()">▶ ${roundNumber+1}. Tur: Kalan ${wrong} Kelimeyi Tekrar Sor</button>
        <button class="secondary" onclick="resetAll()">Bu Temayı Yeniden Başlat</button>
      </div>
    </div>`;
}

function render(){
  document.getElementById('tallyOk').textContent = markOrder.filter(m=>m.correct).length;
  document.getElementById('tallyBad').textContent = markOrder.filter(m=>!m.correct).length;
  document.getElementById('progress').textContent = roundNumber===1
    ? `${markOrder.length} / ${sessionList.length}`
    : `Tur ${roundNumber} · ${markOrder.length} / ${sessionList.length}`;
  if(document.getElementById('catSelect').value != currentCatIndex){
    document.getElementById('catSelect').value = currentCatIndex;
  }

  const markArea = document.getElementById('markArea');
  const hint = document.getElementById('hintText');

  if(roundMissed !== null){
    renderRoundResults();
    return;
  }
  hint.style.display = '';

  const log = document.getElementById('log');
  let html = roundNumber > 1 ? `<div class="cat-divider">🔁 Tur ${roundNumber} — Sadece Bilinemeyenler</div>` : '';
  for(let i = 0; i < pos; i++){
    const w = sessionList[i];
    const q = mode==='de-tr' ? w.de : w.tr;
    const a = mode==='de-tr' ? w.tr : w.de;
    const mk = markOrder[i];
    const icon = mk && mk.correct ? '✅' : '❌';
    html += `
      <div class="row">
        <div class="num">${i+1}.</div>
        <div class="q">${q}</div>
        <div class="a show">${a} &nbsp;${icon}</div>
      </div>`;
  }
  if(pos < sessionList.length && started){
    const w = sessionList[pos];
    const q = mode==='de-tr' ? w.de : w.tr;
    const a = mode==='de-tr' ? w.tr : w.de;
    html += `
      <div class="row active">
        <div class="num">${pos+1}.</div>
        <div class="q">${q}</div>
        <div class="a ${phase===1?'show':''}">${phase===1 ? a : ''}</div>
      </div>`;
  }
  log.innerHTML = html;
  log.scrollTop = log.scrollHeight;

  if(phase === 1 && pos < sessionList.length){
    markArea.innerHTML = `
      <div class="markbtns">
        <button class="markbtn ok" onclick="mark(true)">✅ Bildi (Y)</button>
        <button class="markbtn bad" onclick="mark(false)">❌ Bilemedi (N)</button>
      </div>`;
    hint.textContent = 'Öğrenci doğru bildi mi? İşaretleyin (veya Y / N tuşu)';
  } else {
    markArea.innerHTML = '';
    hint.textContent = !started ? 'Kelimeyi görmek için ekrana tıklayın (veya boşluk tuşu)' : 'Cevabı görmek için ekrana tıklayın (veya boşluk tuşu)';
  }
}

async function bootApp(){
  document.getElementById('studentBadge').textContent = '👤 ' + studentName;
  loadState();
  populateCatSelect();
  updateModeBtn();
  render();
}

function init(){
  const saved = localStorage.getItem('kelime_sepeti_student_name');
  if(saved){
    studentName = saved;
    document.getElementById('nameGate').style.display = 'none';
    document.getElementById('appRoot').style.display = '';
    bootApp();
  } else {
    document.getElementById('nameGate').style.display = 'flex';
    document.getElementById('appRoot').style.display = 'none';
  }
}
init();
</script>
